<div class="card p-3">
  <h5>Cadastro tipo de Ração <span *ngIf="editando" class="text-warning">(Editando)</span></h5>

  <form #formCadastroRacao="ngForm">

    <div class="mb-3">
      <label>Tipo</label>
      <input #tipo_racao="ngModel" [(ngModel)]="racao.nome" name="tipo_racao" class="form-control">
    </div>

    <div class="mb-3">
      <label>Descrição</label>
      <textarea #descricao="ngModel" [(ngModel)]="racao.descricao" name="descricao" class="form-control"></textarea>
    </div>

    <div class="mb-3">
      <label>Custo por Kg</label>
      <input type="number" #custo_por_kg="ngModel" [(ngModel)]="racao.custo_total_kg" name="custo_por_kg"
        class="form-control">
    </div>

    <div class="card-footer bg-white border-0 d-flex justify-content-end gap-2">

  <button type="button" class="btn btn-success px-4" (click)="salvar()">
    <i class="fas fa-check-circle me-2"></i>
    {{ editando ? 'Atualizar' : 'Salvar' }}
  </button>

  <button *ngIf="editando"
          type="button"
          class="btn btn-light border px-4"
          (click)="cancelarEdicao()">
    <i class="fas fa-ban me-2"></i>
    Cancelar
  </button>

  <button type="button"
          class="btn btn-primary px-4"
          (click)="menuRacao()">
    <i class="fas fa-home me-2"></i>
    Voltar
  </button>

</div>
  </form>
</div>

<!-- LISTAGEM -->
<div class="card p-3 mt-3">

  <h5>Tipo de Ração cadastradas</h5>

  <!-- 🔍 FILTRO -->
  <div class="mb-3">
    <input type="text" class="form-control" placeholder="Pesquisar nome..." [(ngModel)]="termoBusca">
  </div>

  <table class="table table-striped">
    <thead>
      <tr>
        <th class="text-center fw-bold">#</th>
        <th class="text-center">Nome da Ração</th>
        <th class="text-center">Descrição da Ração</th>
        <th class="text-center">Custo por Kg</th>
        <th class="text-center">Ações</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let item of listaPaginada; let i = index">
        <td class="text-center align-middle fw-bold">{{ i + 1 }}</td>
        <td class="text-center align-middle">{{ item.nome }}</td>
        <td class="text-start align-middle">{{ item.descricao }}</td>
        <td class="text-center align-middle">{{ item.custo_total_kg }}</td>
        <td class="text-center">
          <div class="d-flex justify-content-center gap-2">
            <button class="btn btn-outline-primary btn-sm" (click)="editar(item)">
              <i class="fas fa-edit me-1"></i> Editar
            </button>

            <button class="btn btn-outline-danger btn-sm" (click)="excluir(item.id)">
              <i class="fas fa-trash me-1"></i> Excluir
            </button>
          </div>
        </td>
      </tr>
    </tbody>
  </table>

  <!-- 📄 PAGINAÇÃO -->
  <nav *ngIf="totalPaginas > 1">
    <ul class="pagination">

      <li class="page-item" [class.disabled]="paginaAtual === 1">
        <button class="page-link" (click)="mudarPagina(paginaAtual - 1)">
          Anterior
        </button>
      </li>

      <li class="page-item" *ngFor="let p of [].constructor(totalPaginas); let i = index"
        [class.active]="paginaAtual === i + 1">

        <button class="page-link" (click)="mudarPagina(i + 1)">
          {{ i + 1 }}
        </button>
      </li>

      <li class="page-item" [class.disabled]="paginaAtual === totalPaginas">
        <button class="page-link" (click)="mudarPagina(paginaAtual + 1)">
          Próxima
        </button>
      </li>

    </ul>
  </nav>
</div>
